[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[project]
name = "jobify"
version = "0.12.1"
description = "A modern, lightweight and robust task manager with a user-friendly interface and a wide range of features, using the low-level asyncio API and more."
requires-python = ">=3.10,<3.15"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [
    { name = "Sergey Yavorsky", email = "theseriff@proton.me" },
]
keywords = ["asyncio", "cron", "scheduler", "task-manager", "job-scheduler", "background-tasks"]
classifiers = [
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "crontab>=1.0.5,<2",
    "tzdata>=2026.2; sys_platform == 'win32'",
    "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
cbor2 = ["cbor2>=6.0.0,<7"]
msgpack = ["msgpack>=1.0.7,<2"]
orjson = ["orjson>=3.0.0,<4"]
pydantic = ["pydantic>=2.0,<3"]
fast = ["jobify[orjson,pydantic]"]

[dependency-groups]
optionals = ["jobify[cbor2,msgpack,orjson,pydantic]"]
lint = [
    "mypy==2.0.0",
    "ruff==0.15.12",
    "bandit==1.9.4",
    "zizmor==1.24.1",
    "semgrep==1.162.0",
    "codespell==2.4.2",
    "pyrefly==1.0.0",
    # mypy extensions
    "mypy-extensions==1.1.0",
    "types-python-crontab",
]
test = [
    { include-group = "optionals" },
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=6.2.1",
    "covdefaults>=2.3.0",
    "coverage[toml]==7.13.5",
    # integrations
    "adaptix>=3.0.0b1,<4",
    "uuid7-rs>=0.0.7,<1",
]
docs = [
    "zensical==0.0.41",
    "mkdocstrings[python]==1.0.4",
]
benchmarks = [
    { include-group = "optionals" },
    { include-group = "test" },
    "pytest-codspeed==4.5.0",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "benchmarks" },
    "detect-secrets==1.5.0",
    "prek==0.3.11",
]

[project.urls]
Homepage = "https://theseriff.github.io/jobify/"
Repository = "https://github.com/theseriff/jobify"
Documentation = "https://theseriff.github.io/jobify/"
Changelog = "https://github.com/theseriff/jobify/blob/main/docs/CHANGELOG.md"
Issues = "https://github.com/theseriff/jobify/issues"

# Tests
[tool.pytest.ini_options]
xfail_strict = true
timeout = 10
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "ignore:Async functions are always done in the main loop",
]
markers = []

[tool.coverage.run]
plugins = ["covdefaults"]
relative_files = true
parallel = true
branch = true
concurrency = ["thread", "multiprocessing"]
source = ["src", "tests", "examples"]
omit = ["**/__init__.py"]

[tool.coverage.paths]
source = [
    "src",
    "*/jobify/src",
]
tests = [
    "tests",
    "*/jobify/tests",
]

[tool.coverage.report]
fail_under = 100
skip_empty = true
show_missing = true
exclude_also = [
    'if TYPE_CHECKING:',
    "if __name__ == .__main__.:",
    '@()?abstractmethod',
    "raise NotImplementedError",
    "pass",
    '\.\.\.',
    "ImportError",
]
omit = [
    "*/__init__.py",
    '*/types.py',
]

# Static Analysis
[tool.pyrefly]
python-version = "3.10"
project-includes = ["src", "tests", "benchmarks", "examples"]
search-path = ["src", ".", "examples/real_world/src"]
min-severity = "warn"
preset = "strict"
skip-lsp-config-indexing = false
infer-with-first-use = false

[tool.mypy]
mypy_path = "src:examples/real_world/src"
files = ["src", "tests", "benchmarks"]
python_version = "3.10"
strict = true
pretty = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
allow_untyped_calls = true
disallow_any_explicit = false
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_decorators = false
show_error_codes = true
show_error_context = true
show_column_numbers = true
check_untyped_defs = true
namespace_packages = true
follow_untyped_imports = true

[tool.semgrep]
paths = ["src"]
include = ["src"]

[tool.bandit]
targets = "src"

# Liter
[tool.ruff]
src = ["src"]
include = ["src/**.py", "tests/**.py", "examples/**.py", "benchmarks/**.py"]
target-version = "py310"
line-length = 88
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",  # Conflict: D203 ("one-blank-line-before-class-docstring") is incompatible with D211 (No blank line before class docstring). We follow D211.
    "D213",  # Conflict: D213 ("multi-line summary second line") conflicts with D212 (summary on the same line as triple quotes). We follow D212.
    "COM812", # Conflict: Danger! This rule ("trailing-comma-missing") conflicts with the automatic behavior of "ruff format", which manages trailing commas.
    "SLF001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"benchmarks/**" = ["D", "S101", "T201"]
"examples/**" = ["S101", "D101", "D103", "D104", "T201", "SLF001", "ERA001"]
"tests/**" = ["S101", "D", "SLF001"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]
no-lines-before = ["local-folder"]

[tool.codespell]
skip = "*.pyi,*.pyc,./site,./docs/CHANGELOG.md"

# Python Semantic Release
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
build_command = """
    uv lock --upgrade-package jobify
    git add uv.lock
    uv build
"""
tag_format = "v{version}"
major_on_zero = false
allow_zero_version = true
commit_message = "chore(release): release v{version} [skip ci]"

[tool.semantic_release.commit_parser_options]
major_tags = ["BREAKING CHANGE"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.changelog]
# Recommended patterns for conventional commits parser that is scope aware
exclude_commit_patterns = [
    '''Initial [Cc]ommit.*''', # codespell:ignore ommit
    '''refactor(?:\([^)]*?\))?: .+''',
    '''polish(?:\([^)]*?\))?: .+''',
    '''style(?:\([^)]*?\))?: .+''',
    '''chore(?:\([^)]*?\))?: .+''',
    '''build\((?!deps\): .+)''',
    '''test(?:\([^)]*?\))?: .+''',
    '''ci(?:\([^)]*?\))?: .+''',
    '''Merged? .*''',
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "docs/CHANGELOG.md"
mask_initial_release = true

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[tool.semantic_release.remote]
type = "github"
ignore_token_for_push = true
