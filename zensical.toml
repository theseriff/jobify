# ============================================================================
#
# The configuration produced by default is meant to highlight the features
# that Zensical provides and to serve as a starting point for your own
# projects.
#
# ============================================================================
[project]
repo_name = "theseriff/jobify"
repo_url = "https://github.com/theseriff/jobify"
edit_uri = "edit/main/docs"
site_name = "jobify"
site_description = "A modern, lightweight and robust task manager with a user-friendly interface and a wide range of features, using the low-level asyncio API and more."
site_author = "Sergey Yavorsky"
site_url = "https://theseriff.github.io/jobify"
copyright = "&copy; 2026 Sergey Yavorsky"
nav = [
  { "Quickstart" = "index.md" },
  { "Jobify settings" = "app_settings.md" },
  { "Task settings" = "task_settings.md" },
  { "Schedule" = "schedule.md" },
  { "Job" = "job.md" },
  { "Context" = "context.md" },
  { "Router" = "router.md" },
  { "Integrations" = "integrations.md" },
  { "Contributing" = "contributing.md" },
  { "Changelog" = "CHANGELOG.md" },
  { "Advanced Usage" = [
        "advanced_usage/exceptions.md",
        "advanced_usage/exception_handlers.md",
        "advanced_usage/system_time.md",
        "advanced_usage/queue.md",
        "advanced_usage/retry.md",
    ] },
  { "API Reference" = "api_reference/index.md" },
]

[project.plugins]
search = {}
[project.plugins.mkdocstrings]
handlers = { python = { paths = ["src"] } }

# ----------------------------------------------------------------------------
[project.theme]
variant = "modern"
logo = "images/logo.svg"
favicon = "images/favicon.svg"
font.text = "Lato"
font.code = "Google Sans Code"

# ----------------------------------------------------------------------------
[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# ----------------------------------------------------------------------------
# The "extra" section contains miscellaneous settings.
# ----------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/theseriff/jobify"
name = "Jobify on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/telegram"
link = "https://t.me/jobify_community"
name = "Jobify Telegram Community"
